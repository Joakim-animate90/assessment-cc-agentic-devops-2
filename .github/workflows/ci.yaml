name: CI Pipeline

on:
  push:
    branches:
      - main
      - devel
      - stage
      - 'feature/**'
      - 'bugfix/**'
  pull_request:
    branches:
      - main
      - devel
      - stage

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Install dependencies
        run: npm install

      - name: Cache node_modules
        uses: actions/cache/save@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

  lint:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Restore node_modules
        id: cache
        uses: actions/cache/restore@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Run linter
        run: npm run lint

      - name: Run formatter
        run: npm run prettier

  test:
    needs: [install]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      # Pin Node 15 via setup-node (not a job container): an old node:15
      # container ships a glibc too old for the runner's bundled Node 24,
      # which it uses to exec the JS actions (checkout/cache) inside the
      # container, breaking every step. setup-node gives the same version
      # isolation without that clash.
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Restore node_modules
        id: cache
        uses: actions/cache/restore@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Run tests
        env:
          CI: true
          # App.test.js asserts the rendered api-url span equals this var;
          # without it the span is empty and the test fails.
          REACT_APP_API_URL: http://localhost:3001
        run: npm run test

  build:
    needs: [lint, test]
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '15'

      - name: Restore node_modules
        id: cache
        uses: actions/cache/restore@v3
        with:
          path: node_modules
          key: node-modules-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies (cache miss fallback)
        if: steps.cache.outputs.cache-hit != 'true'
        run: npm install

      - name: Build project
        run: npm run build
